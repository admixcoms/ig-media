name: publish

on:
  # 주 실행: PC 작업 스케줄러가 매일 07:25에 즉시 실행(dispatch)을 요청한다 (scripts/trigger_publish.py).
  # 아래 GitHub 예약은 PC가 꺼졌을 때를 위한 예비 (지연·누락이 잦음).
  # 어떤 방식이든 07:30 KST 전이면 기다렸다가 게시한다. 이미 게시된 날은 아무것도 하지 않는다.
  schedule:
    - cron: "30 20 * * *"   # 05:30 KST
    - cron: "30 21 * * *"   # 06:30 KST
    - cron: "30 22 * * *"   # 07:30 KST
  workflow_dispatch: {}      # PC 07:25 실행 요청, 늦게 승인된 게시물 즉시 발행 (07:30 이후면 바로 게시)

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: publish due posts
        env:
          IG_ACCOUNTS: ${{ secrets.IG_ACCOUNTS }}
        run: python publisher/publish_due.py
      - name: commit results
        if: always()
        run: |
          git config user.name "ig-publisher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "published $(TZ=Asia/Seoul date +%F)" && git pull --rebase && git push)
