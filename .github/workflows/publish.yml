name: publish

on:
  # GitHub 예약 실행은 몇 시간씩 늦게 시작되기도 해서 일찍 신청해 둔다.
  # 일찍 시작된 실행은 07:30 KST까지 기다렸다가 게시한다 (07:30 전 게시 없음).
  # 06:30, 07:30 신청분은 예비. 이미 게시된 날은 아무것도 하지 않는다.
  schedule:
    - cron: "30 20 * * *"   # 05:30 KST
    - cron: "30 21 * * *"   # 06:30 KST
    - cron: "30 22 * * *"   # 07:30 KST
  workflow_dispatch: {}      # 늦게 승인된 게시물 즉시 발행용 (대기 없이 바로 게시)

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: publish due posts
        env:
          IG_ACCOUNTS: ${{ secrets.IG_ACCOUNTS }}
        run: python publisher/publish_due.py
      - name: commit results
        if: always()
        run: |
          git config user.name "ig-publisher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "published $(TZ=Asia/Seoul date +%F)" && git pull --rebase && git push)
