name: publish

on:
  # 주 실행: PC 작업 스케줄러가 매일 07:25에 즉시 실행(dispatch)을 요청한다 (scripts/trigger_publish.py).
  # 아래 GitHub 예약은 PC가 꺼졌을 때를 위한 예비 (지연·누락이 잦음).
  # 어떤 방식이든 07:30 KST 전이면 기다렸다가 게시한다. 이미 게시된 날은 아무것도 하지 않는다.
  schedule:
    - cron: "30 20 * * *"   # 05:30 KST
    - cron: "30 21 * * *"   # 06:30 KST
    - cron: "30 22 * * *"   # 07:30 KST
  workflow_dispatch: {}      # PC 07:25 실행 요청, 늦게 승인된 게시물 즉시 발행 (07:30 이후면 바로 게시)

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: publish due posts
        env:
          IG_ACCOUNTS: ${{ secrets.IG_ACCOUNTS }}
        run: python publisher/publish_due.py
      - name: commit results
        if: always()
        # PC 실행과 외부 예약(cron-job.org)이 같은 날 둘 다 돌면 두 번째 실행이 같은 기록 파일을 다시 써서 부딪힌다(11/12).
        # 부딪히면 먼저 저장된 기록(저장소 쪽)을 둔다(-X ours: rebase 에서 ours = 저장소). 그래도 안 되면 저장소 상태로 돌리고 넘어간다
        # — 기록이 빠져도 다음 실행은 같은 캡션 확인으로 다시 올리지 않는다.
        run: |
          git config user.name "ig-publisher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "published $(TZ=Asia/Seoul date +%F)"
          if ! git pull --rebase -X ours; then
            echo "[warn] record conflict - keep the record already saved"
            git rebase --abort || true
            git reset --hard "@{u}"
            exit 0
          fi
          git push
