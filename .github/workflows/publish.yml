name: publish

on:
  schedule:
    - cron: "30 22 * * *"   # 매일 07:30 KST (GitHub 사정으로 수십 분 늦어질 수 있음)
  workflow_dispatch: {}      # 늦게 승인된 게시물 즉시 발행용

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: publish due posts
        env:
          IG_ACCOUNTS: ${{ secrets.IG_ACCOUNTS }}
        run: python publisher/publish_due.py
      - name: commit results
        if: always()
        run: |
          git config user.name "ig-publisher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "published $(TZ=Asia/Seoul date +%F)" && git pull --rebase && git push)
